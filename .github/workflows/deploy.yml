name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="/root/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use default
            set -e
            cd /var/www/adigo
            rm -rf dist/
            git fetch origin main
            git reset --hard origin/main
            npm install
            npx prisma generate
            npm run build
            # One-off/idempotent schema migrations not wired into the app's
            # own boot-time initDb() — safe to re-run every deploy.
            node dist/src/migrations/run_all_event_migrations.js || true
            node dist/src/migrations/ticketing/run_migration.js || true
            node dist/src/config/migrate_event_columns.js || true
            # psql (libpq) doesn't understand Prisma-only URI query params
            # like ?schema=public - strip everything from the first '?' on.
            DATABASE_URL=$(grep '^DATABASE_URL=' .env | cut -d= -f2- | cut -d'?' -f1)
            psql "$DATABASE_URL" -f migrations/add_created_by_to_event.sql || true
            psql "$DATABASE_URL" -f migrations/ticketing_admin_surface_rebuild.sql || true
            pm2 restart adigo-api || pm2 start ecosystem.config.js